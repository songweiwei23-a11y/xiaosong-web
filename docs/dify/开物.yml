      - data:
          code: |-
            function main({ query, web_query, today }) {
              // 优先用网站生成的联网专用搜索词；旧版网站没传时退回知识库检索词
              const q = String(web_query || query || '').slice(0, 300);
              const body = { query: q, query_rewrite: true, top_k: 10, content_type: 'mainText', way: 'lite' };
              if (today) {
                body.history = [{ role: 'system', content: '今天是' + today + '（北京时间）。改写搜索词时，“最近、本周、今天”等说法要换成具体日期；只保留要查的事，去掉“帮我写、创作”等任务要求。' }];
              }
              return { body: JSON.stringify(body) };
            }
          code_language: javascript
          desc: 开物服务端授权后才执行；不自动重试付费搜索
          outputs:
