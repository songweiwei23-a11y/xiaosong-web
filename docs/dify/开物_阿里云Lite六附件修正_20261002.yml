        - local_file
        - remote_url
      enabled: true
      fileUploadConfig:
        attachment_image_file_size_limit: 2
        audio_file_size_limit: 50
        batch_count_limit: 5
        file_size_limit: 15
        file_upload_limit: 50
        image_file_batch_limit: 10
        image_file_size_limit: 10
        knowledge_file_size_limit: 50
        single_chunk_attachment_limit: 10
        skill_file_size_limit: 50
        video_file_size_limit: 100
        workflow_file_upload_limit: 10
      image:
        enabled: true
        number_limits: 6
        transfer_methods:
          - local_file
          - remote_url
      number_limits: 6
    opening_statement: |
      👋 你好！我是「开物」AI 编导，基于你的编导知识库运行。

      我可以帮你完成：
      - 📋 **选题策划** — 生成 12 个可拍选题，含优先级建议
      - ✍️ **脚本生成** — 完整口播稿 + 结构拆解 + 可替换句式
      - 🎬 **分镜脚本** — 镜头执行表，可直接带去拍摄
      - 🔍 **审稿优化** — 找出问题并给出修改版
      - 🏷️ **标题封面** — 12 个标题方案 + 封面字 + 发布文案
      - 🎯 **账号定位** — 测试方向 + 7 天测试计划

      **使用方式**：直接告诉我你想做什么，或者按下面格式输入：

      ```
      任务类型：脚本生成
      主题：为什么很多人拍短视频坚持不下去
      平台：抖音
      视频时长：60秒
      目标人群：想做短视频但一直拖延的人
      风格：真实、犀利、像朋友提醒
      目标：让别人觉得我懂内容创作
      补充信息：（可选）
      ```
    retriever_resource:
      enabled: true
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: true
    suggested_questions:
      - |-
        任务类型：选题策划
        主题：我想做短视频编导账号，还在摸索定位
        平台：抖音
        目标：测试内容方向和涨粉
      - |-
        任务类型：脚本生成
        主题：普通人做短视频最容易踩的坑
        平台：抖音
        视频时长：60秒
        风格：口语化、犀利
        目标：建立专业信任
      - |-
        任务类型：审稿优化
        目标：提升开头吸引力和口播节奏
        补充信息：（粘贴你的草稿）
    suggested_questions_after_answer:
      enabled: true
    text_to_speech:
      enabled: true
      language: ''
      voice: ''
