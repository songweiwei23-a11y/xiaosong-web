    opening_statement: '👋 你好！我是小宋的编导文案工作台，基于你的编导知识库运行。


      我可以帮你完成：

      - 📋 **选题策划** — 生成 12 个可拍选题，含优先级建议

      - ✍️ **脚本生成** — 完整口播稿 + 结构拆解 + 可替换句式

      - 🎬 **分镜脚本** — 镜头执行表，可直接带去拍摄

      - 🔍 **审稿优化** — 找出问题并给出修改版

      - 🏷️ **标题封面** — 12 个标题方案 + 封面字 + 发布文案

      - 🎯 **账号定位** — 测试方向 + 7 天测试计划


      **使用方式**：直接告诉我你想做什么，或者按下面格式输入：


      ```

      任务类型：脚本生成

      主题：为什么很多人拍短视频坚持不下去

      平台：抖音

      视频时长：60秒

      目标人群：想做短视频但一直拖延的人

      风格：真实、犀利、像朋友提醒

      目标：让别人觉得我懂内容创作

      补充信息：（可选）

      ```

      '
    retriever_resource:
