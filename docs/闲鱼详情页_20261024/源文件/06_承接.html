<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="style.css"></head>
<body><div class="page phone">
<div class="top"><span class="brand">开物</span><span class="pg">06</span></div>
<div class="eyebrow rel">HANDOFF</div>
<div class="h2 rel">板块之间，<span class="grad">内容带着走</span></div>
<div class="body rel">点「带去下一步」，正文、你这次的设置（目的、人群、时长、选中的开头和选题）和参考材料，都会自动带到下一个板块，不用复制粘贴。</div>
<div class="card hi mt32">
  <h3>例：把一段文案做成可拍的完整内容</h3>
  <div class="flow mt16">
    <div class="step"><div class="dot" style="width:44px;height:44px;font-size:19px;border-radius:14px">1</div><div class="txt" style="padding-bottom:14px"><b style="font-size:22px">粘贴已有文案</b></div></div>
    <div class="step"><div class="dot" style="width:44px;height:44px;font-size:19px;border-radius:14px">2</div><div class="txt" style="padding-bottom:14px"><b style="font-size:22px">审稿优化</b></div></div>
    <div class="step"><div class="dot" style="width:44px;height:44px;font-size:19px;border-radius:14px">3</div><div class="txt" style="padding-bottom:14px"><b style="font-size:22px">设计开篇，选一个开头</b></div></div>
    <div class="step"><div class="dot" style="width:44px;height:44px;font-size:19px;border-radius:14px">4</div><div class="txt" style="padding-bottom:14px"><b style="font-size:22px">按开头写脚本</b></div></div>
    <div class="step"><div class="dot" style="width:44px;height:44px;font-size:19px;border-radius:14px">5</div><div class="txt" style="padding-bottom:14px"><b style="font-size:22px">拆分镜，起标题</b></div></div>
  </div>
</div>
<div class="card mt24">
  <h3>也可以从参考视频开始</h3>
  <p>拆解爆款 → 跨行业二创 → 选一个方案，再送去审稿、写脚本或拆分镜。</p>
</div>
<div class="rel mt24"><span class="pill">板块顺序不强制</span><span class="pill">推荐的下一步排在前面</span><span class="pill g">历史记录云端保存</span></div>
<div class="rel mt24 small">AI 输出是否准确、是否符合你的业务实际，仍需要你核对。</div>
<div class="foot"><span>开物 · AI 短视频创作工作台</span><span>06 / 12</span></div>
</div></body></html>
