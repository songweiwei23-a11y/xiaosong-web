<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="style.css"></head>
<body><div class="page phone">
<div class="top"><span class="brand">开物</span><span class="pg">03</span></div>
<div class="eyebrow rel">一条内容的完整路径</div>
<div class="h2 rel">从账号到拍摄，<span class="grad">六步走完</span></div>
<div class="flow rel mt32" style="position:relative">
  <div class="step"><div class="dot">1</div><div class="txt"><b>建档与地基</b><span>导入资料建立账号档案，生成账号定位与创作简报。</span></div></div>
  <div class="step"><div class="dot">2</div><div class="txt"><b>选题与开篇</b><span>给出多条选题方案，再把第一句话设计到能抓人。</span></div></div>
  <div class="step"><div class="dot">3</div><div class="txt"><b>脚本生成</b><span>按内容类型、结构、人群和时长，写出口播正文。</span></div></div>
  <div class="step"><div class="dot">4</div><div class="txt"><b>审稿优化</b><span>指出表达和结构问题，给出可直接改的写法。</span></div></div>
  <div class="step"><div class="dot">5</div><div class="txt"><b>分镜与标题封面</b><span>拆成景别、运镜、画面、台词的镜头表，配标题方案。</span></div></div>
  <div class="step"><div class="dot">6</div><div class="txt"><b>拍摄交付与复盘</b><span>拍摄清单、逐镜头标记，发布后录数据，月报自动汇总。</span></div></div>
</div>
<div class="card mt24"><p>步骤不是强制的顺序。已有稿子的，可以直接从审稿或分镜开始。</p></div>
<div class="foot"><span>开物 · AI 短视频创作工作台</span><span>03 / 12</span></div>
</div></body></html>
