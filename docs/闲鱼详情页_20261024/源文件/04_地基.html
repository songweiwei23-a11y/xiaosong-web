  <div class="card"><h3>③ 创作简报</h3><p>把定位转成生成时直接用的指令，选题、脚本等创作板块读的就是它。</p></div>
  <div class="card hi"><h3>地基一键生成</h3><p>建档后一键生成账号定位、创作简报和行业建议。已经有的不重复做，在后台运行，关掉页面也会保存。</p></div>
</div>
<div class="rel mt32 small">没有地基时，创作类板块会先提示你去完成地基，避免生成通用的答案。</div>
