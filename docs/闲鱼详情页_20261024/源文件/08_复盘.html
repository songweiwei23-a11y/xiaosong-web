<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="style.css"></head>
<body><div class="page phone">
<div class="top"><span class="brand">开物</span><span class="pg">08</span></div>
<div class="eyebrow rel">REVIEW</div>
<div class="h2 rel">发布后录 <span class="grad">3 个数</span>，月报自动汇总</div>
<div class="grid3 mt32">
  <div class="card" style="text-align:center"><div class="num">播放</div><p class="small mt8">必填</p></div>
  <div class="card" style="text-align:center"><div class="num">完播</div><p class="small mt8">必填</p></div>
  <div class="card" style="text-align:center"><div class="num">点赞</div><p class="small mt8">必填</p></div>
</div>
<div class="small rel mt16">咨询、成交可以另外填，不强制。</div>
<div class="card mt32">
  <h3>月报</h3>
  <p>拍摄完成、发布条数、合计播放、完播中位数、表现最好的一条、下个月计划。没录的数字写「未录」，不是 0。</p>
</div>
<div class="card hi mt24">
  <h3>学习进度看得见</h3>
  <p>作品页顶部会显示：离「开物验证写法」还差几条数据。录的数据越多，才越能看出哪种写法真的有效。</p>
</div>
<div class="foot"><span>开物 · AI 短视频创作工作台</span><span>08 / 12</span></div>
</div></body></html>
