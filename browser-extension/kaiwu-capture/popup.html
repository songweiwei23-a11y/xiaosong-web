<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>开物 · 截屏带入</title>
  <style>
    body { width: 300px; margin: 0; padding: 14px; font: 13px/1.6 system-ui, "PingFang SC", "Microsoft YaHei", sans-serif; color: #1f2328; background: #fff; }
    h1 { margin: 0 0 4px; font-size: 15px; }
    p { margin: 0 0 10px; color: #59636e; font-size: 12px; }
    button { display: block; width: 100%; margin-top: 8px; padding: 8px 10px; border: 0; border-radius: 8px; font-size: 13px; cursor: pointer; }
    #collect { background: #e8590c; color: #fff; font-weight: 600; }
    #capture { background: #57606a; color: #fff; }
    #send { background: #1f6feb; color: #fff; }
    #clear { background: #f6f8fa; color: #59636e; }
    button:disabled { opacity: .45; cursor: not-allowed; }
    #count { font-weight: 600; color: #1f2328; }
    #state { color: #e8590c; font-weight: 600; }
    #thumbs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; margin-top: 10px; }
    #thumbs img { width: 100%; aspect-ratio: 16/10; object-fit: cover; border-radius: 4px; border: 1px solid #d0d7de; }
    #msg { margin-top: 8px; min-height: 18px; color: #cf222e; font-size: 12px; }
  </style>
</head>
<body>
  <h1>开物 · 拆对标账号</h1>
  <p>打开对标账号的抖音主页（网页版），点「一键采集」：自动往下翻作品、读点赞，再打开最火的 3 条读评论，大约 1 分钟，读完自动带进开物开始拆解。登录抖音能读得更全。点开始即表示你确认这些是公开可见、可以合法使用的内容。</p>
  <p id="state"></p>
  <button id="collect">一键采集这个账号</button>
  <p style="margin-top:12px">也可以只截当前屏幕：已截 <span id="count">0</span> / 9 张</p>
  <button id="capture">截下当前屏幕</button>
  <button id="send">带进开物拆解</button>
  <button id="clear">清空</button>
  <div id="thumbs"></div>
  <div id="msg"></div>
  <script src="popup.js"></script>
</body>
</html>
